<!doctype html>
<html><head><meta charset="utf-8"></head><body style="font:13px sans-serif;padding:12px"><div id="out">probe running…</div><script>
(async function () {
  var model = await lume.page.ready();
  var results = {};
  window.__keys = [];
  lume.on.key = function (key) {
    window.__keys.push(key.key);
    return key.key === "Escape";
  };
  lume.on.query = function (query) {
    if (query === "tab") document.body.dispatchEvent(new KeyboardEvent("keydown", { key: "Tab", bubbles: true, cancelable: true }));
    if (query === "esc") document.body.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
  };
  function done() {
    document.getElementById("out").textContent = JSON.stringify(results);
    lume.page.dispatch({ type: "item.action", actionId: "report", payload: { probe: results } });
  }
  function runProbe() {
    results.origin = window.location.origin;
    results.srcdoc = window.location.href === "about:srcdoc";
    try { window.localStorage; results.localStorage = "reachable"; } catch (e) { results.localStorage = "blocked"; }
    try { results.parentDoc = parent.document ? "reachable" : "null"; } catch (e) { results.parentDoc = "blocked"; }
    try { results.parentInternals = typeof parent.__TAURI_INTERNALS__; } catch (e) { results.parentInternals = "threw"; }
    results.ownDoc = typeof document;
    results.hasLume = typeof window.lume;
    document.body.dispatchEvent(new KeyboardEvent("keydown", { key: "a", bubbles: true, cancelable: true }));
    document.body.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true }));
    setTimeout(function () { results.keysAfterA = window.__keys.slice(); done(); }, 700);
  }
  if (document.readyState === "complete") setTimeout(runProbe, 0);
  else window.addEventListener("load", runProbe, { once: true });
})();
</script></body></html>
