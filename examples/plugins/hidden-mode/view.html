<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<style>
  /* 与 hello-mode 同一套明暗约定：画布由宿主的 --lume-page-bg 决定，
     这里只给文字上色。 */
  html { color-scheme: light dark; }
  html[data-theme="dark"] { color: #f2f2f4; }
  html[data-theme="light"] { color: #1c1c1e; }
  body { font: 14px "Segoe UI", sans-serif; margin: 0; padding: 18px 22px;
         background: transparent; color: inherit; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  .dim { opacity: .6; font-size: 12px; margin-bottom: 14px; }
  code { background: rgba(128,128,128,.18); padding: 1px 6px; border-radius: 5px; }
</style>
</head>
<body>
  <h1 id="hidden-mode-view">Hidden Mode 👻</h1>
  <div class="dim">本模式声明了 hidden = true：切换栏无 pill、Tab 循环也不经过它。</div>
  <div>当前查询：<code id="q">（空）</code></div>
  <div>进入载荷：<code id="enterView">（无）</code></div>
  <script>
    var $ = function (id) { return document.getElementById(id); };
    lume.on.query = function (q) { $("q").textContent = q || "（空）"; };
    lume.on.enter = function (info) { $("enterView").textContent = info.code + " · " + info.payload; };
  </script>
</body>
</html>
