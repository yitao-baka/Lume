<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; color: #1f2328; }
  :root[data-theme="dark"] { color-scheme: dark; color: #f2f2f2; }
  body { font: 14px "Segoe UI", sans-serif; margin: 0; padding: 18px 22px; background: transparent; color: inherit; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  .dim { opacity: .6; font-size: 12px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
  button { padding: 6px 14px; border: 1px solid rgba(128,128,128,.5); border-radius: 8px; background: transparent; color: inherit; cursor: pointer; }
  button:hover { background: rgba(128,128,128,.15); }
  code { background: rgba(128,128,128,.18); padding: 1px 6px; border-radius: 5px; }
</style>
</head>
<body>
  <h1>Hello Mode</h1>
  <div class="dim">Page Service 持有计数、主题和外部动作；Presenter 只消费模型并发送 Intent。</div>
  <div class="row">搜索框查询：<code id="q">（空）</code></div>
  <div class="row">
    <button data-action="toast">弹一个 Toast</button>
    <button data-action="clip-write">写剪贴板</button>
    <button data-action="clip-read">读剪贴板</button>
    <button data-action="count">存储计数 +1</button>
    <span>计数：<code id="countView">0</code></span>
  </div>
  <div class="row">
    <button data-action="back">回导航页</button>
    <button data-action="grow">窗口长高 120px</button>
    <button data-action="theme-cycle">切换本插件颜色</button>
    <span>主题：<code id="themeView">—</code></span>
  </div>
  <div class="row">
    <button id="sub" data-action="sub-input">接管搜索框</button>
    <button id="subEnd" data-action="sub-input-remove">交还搜索框</button>
    <span>子输入：<code id="subView">（未接管）</code></span>
  </div>
  <div class="row">剪贴板：<code id="clipView">（空）</code></div>
  <div class="row">进入载荷：<code id="enterView">（无）</code></div>
  <script>
  (async function () {
    var model = await lume.page.ready();
    function render(next) {
      if (!next) return;
      model = next;
      document.getElementById("q").textContent = next.data.query || "（空）";
      document.getElementById("countView").textContent = String(next.data.count || 0);
      document.getElementById("clipView").textContent = next.data.clipboardText || "（空）";
      document.getElementById("subView").textContent = next.data.subInputActive
        ? (next.data.subInputText || "（已接管）")
        : "（未接管）";
      document.getElementById("themeView").textContent = next.data.theme
        ? next.data.theme.pref + " (" + next.data.theme.mode + ")"
        : "—";
      var enter = next.data.enter;
      document.getElementById("enterView").textContent = enter ? enter.code + " · " + enter.payload : "（无）";
      lume.page.reportLayout({ sizing: "fixed", height: next.data.height || 560 });
    }
    document.addEventListener("click", function (event) {
      var button = event.target.closest("[data-action]");
      if (!button) return;
      lume.page.dispatch({ type: "item.action", actionId: button.dataset.action });
    });
    lume.on.theme = function (mode) {
      (window.__themeLog || (window.__themeLog = [])).push({ id: "hello-mode", mode: mode });
      document.documentElement.dataset.theme = mode === "light" ? "light" : "dark";
    };
    lume.on.skin = function (visual) {
      (window.__skinLog || (window.__skinLog = [])).push(visual);
      document.documentElement.dataset.skin = visual.id;
    };
    lume.page.subscribe(render);
    render(model);
  })();
  </script>
</body>
</html>
