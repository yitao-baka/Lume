<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 14px "Segoe UI", sans-serif; margin: 0; padding: 10px 16px; background: transparent; color: inherit; }
  .dim { opacity: .6; font-size: 12px; margin: 4px 0 10px; }
  .item { padding: 7px 10px; border-radius: 7px; }
  .none { opacity: .55; padding: 7px 10px; }
</style>
</head>
<body>
  <div class="dim">标题栏里的搜索框是第二个受限 Presenter iframe；输入经 app.setQuery 回到同一 Page Service。</div>
  <div id="list"></div>
  <script>
  (async function () {
    var model = await lume.page.ready();
    function render(next) {
      if (!next) return;
      model = next;
      var list = document.getElementById("list");
      var items = next.data.items || [];
      list.innerHTML = items.length
        ? items.map(function (item) { return '<div class="item">' + item.label + '</div>'; }).join("")
        : '<div class="none">无匹配结果</div>';
    }
    lume.page.subscribe(render);
    render(model);
  })();
  </script>
</body>
</html>
