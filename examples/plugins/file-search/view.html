<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; background: transparent; color: inherit; user-select: none; overflow: hidden; }
  #hint { padding: 26px 24px; opacity: .55; line-height: 1.7; }
  #meta { position: fixed; right: 14px; top: 12px; font-size: 11px; opacity: .45; pointer-events: none; }
  #backend { padding: 6px 24px 0; font-size: 11px; opacity: .55; }
  #list { position: absolute; top: 30px; bottom: 0; left: 0; right: 0; overflow-y: auto; padding-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 6px 18px 6px 14px; border-left: 3px solid transparent; }
  .row.sel { background: rgba(128,150,200,.22); border-left-color: rgba(120,160,255,.9); }
  .glyph { flex: 0 0 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; background: rgba(128,128,128,.16); }
  .body { flex: 1 1 auto; min-width: 0; }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .path { font-size: 11px; opacity: .55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  .copy { flex: 0 0 auto; opacity: 0; font-size: 11px; padding: 3px 9px; border: 1px solid rgba(128,128,128,.5); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
  .row.sel .copy, .row:hover .copy { opacity: .8; }
  .empty { padding: 20px 24px; opacity: .55; line-height: 1.7; }
</style>
</head>
<body>
  <div id="backend"></div>
  <div id="meta"></div>
  <div id="hint">输入以搜索全盘文件 — 结果来自 Page Service<br><span style="font-size:12px">↑↓ 选择 · Enter 打开 · Ctrl+Enter 复制路径 · 点击打开</span></div>
  <div id="list"></div>
  <script>
  (async function () {
    var model = await lume.page.ready();
    var list = document.getElementById("list");
    var hint = document.getElementById("hint");
    function esc(text) { return String(text).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
    function ext(name) { return String(name).split(".").pop().toUpperCase().slice(0, 4); }
    function render(next) {
      if (!next) return;
      model = next;
      var data = next.data || {};
      var items = data.items || [];
      document.getElementById("backend").textContent = data.notice || "";
      document.getElementById("meta").textContent = (data.backend || "") + " · " + items.length + " 项";
      hint.style.display = items.length ? "none" : "block";
      if (!items.length) {
        list.innerHTML = '<div class="empty">' + esc(data.empty || "无结果") + '</div>';
        return;
      }
      list.innerHTML = items.map(function (item) {
        return '<div class="row' + (item.id === data.selectedId ? " sel" : "") + '" data-id="' + esc(item.id) + '">'
          + '<div class="glyph">' + esc(ext(item.label)) + '</div>'
          + '<div class="body"><div class="name">' + esc(item.label) + '</div>'
          + '<div class="path">' + esc(item.description || "") + '&nbsp;</div></div>'
          + '<button class="copy" data-copy="' + esc(item.id) + '">复制路径</button></div>';
      }).join("");
    }
    document.addEventListener("click", function (event) {
      var copy = event.target.closest("[data-copy]");
      if (copy) {
        lume.page.dispatch({ type: "item.action", targetId: copy.dataset.copy, actionId: "copy-path" });
        return;
      }
      var row = event.target.closest(".row");
      if (row) lume.page.dispatch({ type: "item.activate", targetId: row.dataset.id });
    });
    lume.on.key = function (key) {
      var items = model.data.items || [];
      var index = items.findIndex(function (item) { return item.id === model.data.selectedId; });
      if (key.key === "ArrowDown") lume.page.dispatch({ type: "selection.move", payload: { delta: 1 } });
      else if (key.key === "ArrowUp") lume.page.dispatch({ type: "selection.move", payload: { delta: -1 } });
      else if (key.key === "Enter" && items[index]) {
        lume.page.dispatch({ type: key.ctrlKey ? "item.action" : "item.activate", targetId: items[index].id, actionId: key.ctrlKey ? "copy-path" : undefined });
      }
    };
    lume.page.subscribe(render);
    render(model);
  })();
  </script>
</body>
</html>
