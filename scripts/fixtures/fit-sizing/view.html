<!doctype html>
<html>
  <head><meta charset="utf-8" /></head>
  <body style="margin:0;padding:16px;font:14px sans-serif">
    <h1>Fit sizing</h1>
    <p>This Presenter owns its page-area height.</p>
    <script>
      (async function () {
        await lume.page.ready();
        await lume.page.reportLayout({ sizing: "fit", contentHeight: 320 });
        lume.on.query = function (query) {
          if (query === "fixed") lume.page.reportLayout({ sizing: "fixed", height: 480 });
          else lume.page.reportLayout({ sizing: "fit", contentHeight: 320 });
        };
      })();
    </script>
  </body>
</html>
