<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=__PROBE_BASE__/meta-refresh?secret=presenter" />
    <style>body { font: 14px sans-serif; padding: 16px; }</style>
  </head>
  <body>
    <h1>Network isolation probe</h1>
    <form id="probe-form" method="post" action="__PROBE_BASE__/form">
      <input name="payload" value="form-bypass" />
    </form>
    <script>
      (async function () {
        const base = "__PROBE_BASE__";
        try { await fetch(base + "/fetch", { method: "POST", body: "fetch-bypass" }); } catch {}
        try { await fetch(base + "/no-cors", { method: "POST", mode: "no-cors", body: "no-cors-bypass" }); } catch {}
        try { new Image().src = base + "/image?beacon=1"; } catch {}
        try { new WebSocket(base.replace(/^http/, "ws") + "/socket"); } catch {}
        try { new EventSource(base + "/events"); } catch {}
        try { document.getElementById("probe-form").submit(); } catch {}
        try { location.href = base + "/location-href?secret=presenter"; } catch {}
        try { location.assign(base + "/location-assign?secret=presenter"); } catch {}
        try { location.replace(base + "/location-replace?secret=presenter"); } catch {}
        try {
          const link = document.createElement("a");
          link.href = base + "/anchor-click?secret=presenter";
          link.textContent = "probe";
          document.body.appendChild(link);
          link.click();
        } catch {}
        try { window.open(base + "/window-open?secret=presenter", "_blank"); } catch {}
        await lume.page.ready();
      })();
    </script>
  </body>
</html>
