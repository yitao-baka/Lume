[package]
name = "lume"
version = "2.8.0"
description = "A lightweight Windows productivity launcher."
authors = ["Lume"]
edition = "2021"
# Tauri bundler picks the "main binary" via `default-run`; without it the
# externalBin `lume-svc` wins and MSI bundling fails with ICE30.
default-run = "lume"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Production: serve the embedded frontend (dist) instead of the dev URL.
# tauri CLI (`tauri build`) enables this automatically when the feature
# exists; `tauri dev` / bare `cargo run` leave it off and load devUrl
# (localhost:1420) — the same split as the create-tauri-app template.
# Recipe: it must NOT be pinned in the tauri dependency's features list,
# or every build (dev included) would serve the embedded dist.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
# WebView2 idle memory trimming (`SetMemoryUsageTargetLevel` via the COM
# controller tauri exposes). Version matches tauri's transitive dep (0.38.2)
# and its windows-core 0.61, so `windows::core::Interface::cast` applies.
webview2-com = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
arboard = "3.6"
pinyin = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
# .lupx plugin packages (plugin_install.rs) — read + write zip archives.
# Only the deflate codec: stored entries always work, the rest (bzip2/lzma/
# aes) is dead weight for a plugin bundle.
zip = { version = "2", default-features = false, features = ["deflate"] }
# .lupx signatures (plugin_sign.rs, #32.2) — ed25519 verify + sign CLI.
# All pure Rust; getrandom feeds the keygen seed from OS entropy.
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.2"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",      # GetUserDefaultUILanguage (tray label locale)
  "Win32_Graphics_Gdi",       # HBITMAP, GetDIBits, GetDC for icon conversion
  "Win32_Graphics_Dwm",       # clear_dwm_border: DWMWA_BORDER_COLOR on frameless windows
  "Win32_System_Com",         # CoInitializeEx / CoUninitialize
  "Win32_System_Variant",     # VARIANT / VT_I4 (explorer folder path via IShellWindows)
  "Win32_UI_Shell_Common",    # SHGetPathFromIDListW / IPersistFolder2::GetCurFolder (explorer)
  "Win32_System_Ole",         # IShellBrowser->IOleWindow::GetWindow (match shell window hwnd)
  "Win32_UI_Shell",           # IShellItemImageFactory, SHCreateItemFromParsingName
  "Win32_Storage_EnhancedStorage", # P6.8: PKEY_AppUserModel_ID (per-window AUMID)
  "Win32_UI_Shell_PropertiesSystem", # P6.8: IPropertyStore + SHGetPropertyStoreForWindow
  "Win32_System_Com_StructuredStorage", # P6.8: PROPVARIANT for IPropertyStore::SetValue
  "Win32_System_Services",    # SCM: CreateServiceW / StartServiceCtrlDispatcherW (LumeSVC)
  "Win32_System_Registry",    # HKLM DataDir, HKCU Run (autostart)
  "Win32_System_Pipes",       # CreateNamedPipeW (LumeSVC IPC)
  "Win32_System_IO",          # ReadFile / WriteFile / ConnectNamedPipe / DisconnectNamedPipe
  "Win32_Storage_FileSystem", # CreateFileW (pipe client)
  "Win32_Security",           # TokenElevation check, GetTokenInformation
  "Win32_Security_Authorization", # pipe SDDL (ConvertStringSecurityDescriptorToSecurityDescriptorW)
  "Win32_System_Threading",   # GetCurrentProcess / OpenProcessToken
  "Win32_System_Environment", # envwatch: SetEnvironmentVariableW / ExpandEnvironmentStringsW
  "Win32_System_LibraryLoader", # envwatch: GetModuleHandleW (hidden window class)
  "Win32_UI_WindowsAndMessaging", # envwatch: message-only window + WM_SETTINGCHANGE pump
  "Win32_UI_Input",            # clipboard paste: SendInput (Ctrl+V simulation)
  "Win32_System_DataExchange", # clipboard: OpenClipboard / GetClipboardData / CF_HDROP
  "Win32_System_Memory",       # clipboard: GlobalAlloc/Lock/Unlock (CF_HDROP rebuild)
  "Win32_System_ProcessStatus", # clipboard: QueryFullProcessImageNameW (source app)
  "Win32_System_Ioctl",        # usnidx: FSCTL_ENUM/READ_USN_JOURNAL etc (LumeSVC file index)
  "Win32_System_Diagnostics_ToolHelp", # svc: process snapshot (Everything dormancy probe)
  "Win32_System_WindowsProgramming", # usnidx: DRIVE_FIXED (volume discovery)
  "Win32_System_RemoteDesktop", # svc: ProcessIdToSessionId (Everything dormancy probe)
  "Win32_Networking_WinHttp",  # plugin host: WinHTTP request path (no CORS, system proxy)
] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",            # ShellExecuteW for launching .lnk shortcuts
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input",            # GetAsyncKeyState (mid-drag detection)
  "Win32_System_DataExchange", # GetClipboardSequenceNumber for the listener
] }

# Dependency crates get line tables only: full debuginfo for every dep was the
# bulk of target/debug (tens of GB of PDBs). Workspace crates keep full
# debuginfo, so debugging Lume's own code is unaffected. Remove to restore.
[profile.dev.package."*"]
debug = "line-tables-only"

