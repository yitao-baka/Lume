<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e1e20" />
    <style>
      /* The initial document exists before Vite CSS/JS. Keep the unframed
         WebView2 canvas dark until windowBootstrap applies the real theme. */
      html:not([data-window-kind]),
      html:not([data-window-kind]) body,
      html:not([data-window-kind]) #root {
        background-color: #1e1e20;
        color-scheme: dark;
      }
    </style>
    <title>Lume</title>
  </head>

  <body>
    <!-- No JS means no i18n: the fallback carries all three languages. -->
    <noscript>
      You need to enable JavaScript to run this app.<br />
      需要启用 JavaScript 才能运行此应用。<br />
      需要啟用 JavaScript 才能執行此應用程式。
    </noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
