# Hello Mode — the reference example for disk MODE plugins (ROADMAP #7 v2).
# Install: copy this folder into <base>/plugins/, restart Lume (or trigger a
# settings change), then type the global keyword "hello" (or "你好") in
# Navigate and pick 「进入 Hello Mode」 — or Tab to it in the mode pills.
# The page can also be detached into its own window: hover the mode page and
# click 「在独立窗口打开」 (P6 — see docs/PLUGIN_API.md §6G).
id = "hello-mode"
name = "Hello Mode"
version = "1.2.0"
kind = "mode"
description = "示例模式插件：iframe 自由 UI + 插件存储 + toast + 剪贴板 + 自定窗口高度 + 自定搜索框占位文字 + 独立窗口分离"
keywords = ["hello", "你好"]
entry = "main.js"     # 可选 — 逻辑钩子（onQuery/onShow/onHide）
permissions = ["clipboard"]   # P3.2 起强制：示例页要用剪贴板读写
view = "view.html"    # 必填 — 桥接 iframe 渲染的自由 UI
height = 560          # 可选 — 本模式页面的窗口高度（逻辑 px）；省略 = 全局设置高度
detachable = true     # P6 — 允许分离为独立窗口（模式页右上角悬停显现按钮）

# 声明式进入（P2.1）：输入 "hello:xxx" 出「处理这段文本」行，激活把该查询
# 作为 payload 投递给 onEnter（页面收 lume.on.enter，钩子写 storage）。
[[features]]
code = "shout"
label = "Hello Mode：处理这段文本"
regex = "^hello:"
