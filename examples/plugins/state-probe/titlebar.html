<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><title>State Probe TB</title><style>
:root{color-scheme:light dark}html,body{margin:0;height:100%;background:transparent;overflow:hidden}#tb{width:220px;height:20px;margin:5px 0 0 10px}
</style></head><body><input id="tb" type="text" placeholder="titlebar probe"><script>
(async function(){var tb=document.getElementById("tb");function applyEnter(info){if(info&&info.payload!=null)tb.value=String(info.payload)+"-TB";}var model=await lume.page.ready();if(model&&model.data&&model.data.enter)applyEnter(model.data.enter);lume.page.subscribe(function(next){if(next&&next.data&&next.data.enter)applyEnter(next.data.enter);});lume.on.enter=applyEnter;})();
</script></body></html>
