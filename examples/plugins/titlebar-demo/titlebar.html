<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; gap: 8px; padding: 0 4px; font: 13px "Segoe UI", sans-serif; color: inherit; background: transparent; }
  body.light { color: #1f2328; }
  input { flex: 1; min-width: 0; height: 26px; padding: 0 10px; border: 1px solid rgba(128,128,128,.4); border-radius: 6px; background: transparent; color: inherit; outline: none; }
  input:focus { border-color: #5ac8fa; }
</style>
</head>
<body>
  <input id="q" type="text" placeholder="在标题栏里搜索…" spellcheck="false" autocomplete="off">
  <script>
    var input = document.getElementById("q");
    input.addEventListener("input", function () { lume.app.setQuery(input.value); });
    lume.on.query = function (q) { if (q !== input.value) input.value = q || ""; };
    lume.on.theme = function (mode) { document.body.classList.toggle("light", mode === "light"); };
    lume.on.show = function () { input.focus(); };
    input.addEventListener("keydown", function (e) { if (e.key === "Escape" && !e.isComposing) input.blur(); });
  </script>
</body>
</html>
