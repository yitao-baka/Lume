<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>State Probe</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px "Segoe UI", sans-serif; margin: 0; padding: 14px; background: transparent; color: inherit; }
  .row { margin: 8px 0; }
  input[type="text"] { width: 320px; }
  #note { border: 1px dashed rgba(128,128,128,.5); padding: 6px; min-height: 20px; }
  #scroller { height: 90px; overflow: auto; border: 1px solid rgba(128,128,128,.4); padding: 6px; }
  #scrollmirror { width: 90px; }
</style>
</head>
<body>
  <div class="row"><input id="src" type="text" placeholder="src"></div>
  <div class="row"><label><input id="flag" type="checkbox"> flag</label></div>
  <div class="row"><select id="multi" multiple size="3"><option value="a">a</option><option value="b">b</option><option value="c">c</option></select></div>
  <div class="row"><input name="nameOnly" type="text" placeholder="name-only"></div>
  <div class="row"><input name="duplicate" type="text" placeholder="duplicate 1"> <input name="duplicate" type="text" placeholder="duplicate 2"></div>
  <div class="row"><div id="note" contenteditable="true">note</div></div>
  <div class="row"><input id="jsn" type="text" readonly placeholder="js counter"> <input id="scrollmirror" type="text" readonly placeholder="scrollTop"></div>
  <div class="row"><input id="evt" type="text" readonly placeholder="last event" style="width:320px"></div>
  <div id="scroller"><div style="height:600px">scrollable content</div></div>
  <script>
  (async function () {
    var model = await lume.page.ready();
    var src = document.getElementById("src");
    var flag = document.getElementById("flag");
    var multi = document.getElementById("multi");
    var note = document.getElementById("note");
    var jsn = document.getElementById("jsn");
    var scroller = document.getElementById("scroller");
    var mirror = document.getElementById("scrollmirror");
    var evt = document.getElementById("evt");
    var late = null;

    function render(next) {
      if (!next) return;
      model = next;
      var data = next.data || {};
      var fields = data.fields || {};
      src.value = fields.src || "";
      flag.checked = !!fields.flag;
      Array.from(multi.options).forEach(function (option) { option.selected = (fields.multi || []).indexOf(option.value) >= 0; });
      if (note.innerText !== String(fields.note || "")) note.innerText = String(fields.note || "");
      // #jsn is Presenter-local state: it survives hide/show and frame
      // snapshots, but is not part of the Page Model. A fresh mount starts at
      // the empty placeholder; a declarative re-entry drops stale frames.
      mirror.value = String(fields.scroll == null ? "0" : fields.scroll);
      scroller.scrollTop = Number(fields.scroll || 0);
      evt.value = fields.lastEvent || "";
      if (late) late.value = fields.late || "";
      lume.page.reportLayout({ sizing: "fixed", height: 480 });
    }
    function dispatchField(id, value, checked, selected) {
      lume.page.dispatch({ type: "item.action", actionId: "set-field", payload: { id: id, value: value, checked: checked, selected: selected } });
    }
    setTimeout(function () {
      if (document.getElementById("late")) return;
      late = document.createElement("input");
      late.id = "late";
      late.type = "text";
      late.placeholder = "late";
      late.style.width = "220px";
      document.body.appendChild(late);
      late.addEventListener("input", function () { dispatchField("late", late.value); });
      render(model);
      late.dispatchEvent(new Event("input", { bubbles: true }));
    }, 600);
    src.addEventListener("input", function () { dispatchField("src", src.value); });
    flag.addEventListener("change", function () { dispatchField("flag", "", flag.checked); });
    multi.addEventListener("change", function () { dispatchField("multi", "", false, Array.from(multi.selectedOptions).map(function (o) { return o.value; })); });
    note.addEventListener("input", function () { dispatchField("note", note.innerText); });
    scroller.addEventListener("scroll", function () { mirror.value = String(scroller.scrollTop); dispatchField("scrollmirror", mirror.value); });
    lume.on.query = function (query) {
      var match = /^js:(\d+)$/.exec(String(query || ""));
      if (match) jsn.value = match[1];
      match = /^named:(.*)$/.exec(String(query || ""));
      if (match) {
        var named = document.querySelector('[name="nameOnly"]');
        var duplicates = Array.from(document.querySelectorAll('[name="duplicate"]'));
        if (named) {
          named.value = match[1] + "-name";
          named.dispatchEvent(new Event("input", { bubbles: true }));
        }
        duplicates.forEach(function (field, index) {
          field.value = match[1] + "-dup-" + (index + 1);
          field.dispatchEvent(new Event("input", { bubbles: true }));
        });
      }
    };
    lume.on.snapshot = function () { return { n: Number(jsn.value || 0) }; };
    lume.on.restore = function (snapshot) { if (snapshot && snapshot.n != null) jsn.value = String(snapshot.n); };
    lume.page.subscribe(render);
    render(model);
  })();
  </script>
</body>
</html>
