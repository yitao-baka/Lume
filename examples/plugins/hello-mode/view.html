<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px "Segoe UI", sans-serif; margin: 0; padding: 18px 22px;
         background: transparent; color: inherit; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  .dim { opacity: .6; font-size: 12px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  button { padding: 6px 14px; border: 1px solid rgba(128,128,128,.5);
           border-radius: 8px; background: transparent; color: inherit;
           cursor: pointer; }
  button:hover { background: rgba(128,128,128,.15); }
  code { background: rgba(128,128,128,.18); padding: 1px 6px; border-radius: 5px; }
  #q { font-weight: 600; }
</style>
</head>
<body>
  <h1>Hello Mode 👋</h1>
  <div class="dim">磁盘模式插件示例 — 这整个页面是你的自由 UI（桥接 iframe）</div>
  <div class="row">搜索框查询：<code id="q">（空）</code></div>
  <div class="row">
    <button id="toast">弹一个 Toast</button>
    <button id="clip">写剪贴板</button>
    <button id="count">存储计数 +1</button>
    <span>计数：<code id="countView">…</code></span>
  </div>
  <div class="row">
    <button id="paste">读剪贴板 → 标题</button>
    <button id="back">回导航页（setQuery）</button>
    <button id="grow">窗口长高 120px（app.resize）</button>
  </div>
  <div class="row">
    <button id="ph">自定搜索框占位文字（setPlaceholder）</button>
    <button id="phReset">恢复默认占位文字</button>
  </div>
  <div class="row">
    <button id="sub">接管搜索框（setSubInput）</button>
    <button id="subEnd">交还搜索框（removeSubInput）</button>
    <span>子输入收到：<code id="subView">（未接管）</code></span>
  </div>
  <div class="row">进入载荷：<code id="enterView">（无）</code></div>
  <script>
    var n = 0;
    var $ = function (id) { return document.getElementById(id); };
    var render = function () { $("countView").textContent = String(n); };

    lume.on.query = function (q) { $("q").textContent = q || "（空）"; };
    lume.on.show = function () { /* 每次呼出 */ };
    // 接管搜索框后，宿主把每一次按键送到这里（不再触发常规搜索）。
    lume.on.subInput = function (text) { $("subView").textContent = text || "（空）"; };
    // 声明式进入（features）或 redirect 带过来的载荷。
    lume.on.enter = function (info) {
      $("enterView").textContent = info.code + " · " + info.type + " · " + info.payload;
    };

    $("toast").onclick = function () { lume.app.toast("来自 hello-mode 的问候 👋"); };
    $("clip").onclick = function () { lume.clipboard.writeText("hello from hello-mode"); };
    $("paste").onclick = function () {
      lume.clipboard.readText().then(function (t) { $("q").textContent = t || "(空)"; });
    };
    $("back").onclick = function () { lume.app.setQuery(""); };
    // 运行时改窗口尺寸：只传 height 时宽度保持不变；尺寸保持到下一次
    // 内容驱动的 resize（切模式 / 导航页自动适配会恢复配置值）。
    $("grow").onclick = function () {
      lume.app.resize({ height: document.documentElement.clientHeight + 120 });
    };

    // 运行时自定搜索框占位文字：只在本模式页激活时显示；传 "" 恢复默认。
    $("ph").onclick = function () {
      lume.app.setPlaceholder("在 Hello Mode 里搜点什么…");
    };
    $("phReset").onclick = function () {
      lume.app.setPlaceholder("");
    };
    $("sub").onclick = function () {
      lume.app.setSubInput({ placeholder: "子输入框：输入会送到插件（Esc 退出模式）" });
      $("subView").textContent = "（已接管）";
    };
    $("subEnd").onclick = function () {
      lume.app.removeSubInput();
      $("subView").textContent = "（未接管）";
    };

    lume.storage.get("count").then(function (v) { n = v || 0; render(); });
    $("count").onclick = function () {
      n += 1;
      lume.storage.set("count", n).then(render);
    };
  </script>
</body>
</html>
