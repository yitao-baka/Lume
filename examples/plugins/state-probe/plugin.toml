# State Probe — 会话/分离状态验证夹具（docs/ROADMAP_HISTORY.md #40）
# 覆盖：表单（input/checkbox/select multiple/contenteditable）、滚动容器、
# 自定义快照钩子（lume.on.snapshot/restore）、load 后 600ms 才插入的「迟到
# DOM」（验证宿主恢复重试）、以及 titlebar 帧的独立状态回传。
# 驱动方式：启动器搜索框输 src:... / flag:on / multi:a,c / note:... / js:7 /
# scroll:200 / late:...（页面把这些映射到自己的控件）；分离后 keyword 进入
# 会把 query 作为 enter payload 投进窗口（view 的 #src = payload，titlebar 的
# #tb = payload + "-TB"，用于区分两帧）。
id = "state-probe"
name = "State Probe"
version = "1.0.0"
kind = "mode"
description = "会话与分离状态探针（docs/ROADMAP_HISTORY.md #40 验证夹具）"
keywords = ["stateprobe", "状态探针"]
view = "view.html"
titlebar = "titlebar.html"
height = 480
detachable = true
# 闲置重置豁免（docs/ROADMAP_HISTORY.md #46 夹具）：验证「清单声明 keep_session 默认保留，
# 用户级 override 可翻转」两条路径。
keep_session = true
# 进入规则："sp:" 前缀 → 「State Probe：注入」行，激活把查询作为 enter
# payload 投进页面（分离后走窗口的跨窗推送）——测试用驱动通道。
[[features]]
code = "probe"
label = "State Probe：注入"
regex = "^sp:"
