# 文件秒搜 — the reference example for a disk MODE plugin built on the host
# `search.files` capability (docs/ROADMAP_HISTORY.md #20). Install: copy this folder into
# <base>/plugins/, restart Lume (or trigger a settings change), then type the
# global keyword "秒搜" (or "file") in Navigate and pick 「进入 文件秒搜」 —
# or Tab to it in the mode pills. Type in the launcher search box: whole-drive
# file hits render here (Everything when running, the LumeSVC USN index
# otherwise). ↑/↓ select, Enter opens, Ctrl+Enter copies the path, click opens.
id = "file-search"
name = "文件秒搜"
version = "2.0.0"
kind = "mode"
api = 2
description = "全盘文件秒搜模式：宿主 search.files 能力（Everything / LumeSVC 引擎）+ 键盘导航"
keywords = ["秒搜", "file"]
entry = "service.js"
permissions = ["search.files", "clipboard"] # 起强制：宿主 search.files 能力 + 复制路径
model = "lume.collection/v1"
page_runtime = true
default_presenter = "default"
height = 560          # 本模式页面的窗口高度（逻辑 px）

detachable = true     # allow the search page to stay open in its own window
icon = "icon.svg"

[[presenters]]
id = "default"
name = "Default"
entry = "view.html"
models = ["lume.collection/v1"]

[[presenters]]
id = "compact"
name = "Compact"
entry = "compact.html"
models = ["lume.collection/v1"]
